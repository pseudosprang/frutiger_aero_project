name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Ti permette di avviarlo manualmente da GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pygame-ce pyinstaller

    - name: Compila con PyInstaller
      run: |
        pyinstaller --windowed --add-data "assets:assets" frutiger_aero.py

    - name: Carica il file .app come risorsa
      uses: actions/upload-artifact@v4
      with:
        name: frutiger_aero-macos
        path: dist/frutiger_aero.app